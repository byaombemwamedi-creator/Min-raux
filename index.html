*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,button,input,select,textarea,nav{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.g{position:absolute;width:var(--s);height:var(--s);background:linear-gradient(135deg,var(--ac),var(--em));opacity:.1;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.gx{left:-15%;top:var(--y);animation:rx var(--d) linear infinite alternate}
.gy{top:-15%;left:var(--x);animation:ry var(--d) linear infinite alternate}
@keyframes rx{to{transform:translateX(115vw) rotate(180deg)}}
@keyframes ry{to{transform:translateY(115vh) rotate(-180deg)}}
@media (prefers-reduced-motion:reduce){.g{animation:none}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--sb);border-bottom:1px solid var(--bd)}
header h1{font-size:18px;margin:0;flex:1}
button{cursor:pointer;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac)}
.pr{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
#side{position:fixed;z-index:10;top:0;bottom:0;left:0;width:260px;max-width:82%;background:var(--sb);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .25s;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;display:flex;flex-direction:column;gap:4px}
#side.o{transform:none}
#side button{text-align:left;border:0;background:none;padding:12px;font-size:15px}
#side button.a{background:var(--bg2);color:var(--ac)}
#sh{position:fixed;inset:0;z-index:9;background:#0008;display:none}#sh.o{display:block}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px 14px 80px}
h2{margin:6px 0 12px;font-size:22px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card img{width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.tag{display:inline-block;font:12px system-ui;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin:2px 4px 2px 0}
.tag.s{color:var(--em);border-color:var(--em)}.tag.x{color:#e07a5f;border-color:#e07a5f}
.mu{color:var(--mu);font-size:14px}
label{display:block;margin:10px 0 4px;font:600 13px system-ui;color:var(--mu)}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.cm{border-top:1px solid var(--bd);margin-top:8px;padding-top:6px;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.ad-card{background:linear-gradient(135deg,rgba(212,169,74,0.08),rgba(63,181,131,0.08));border:1px dashed var(--ac);text-align:center;padding:12px;font-size:13px;color:var(--mu)}
#st{position:fixed;z-index:20;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#111;padding:8px 14px;border-radius:99px;font:600 14px system-ui;display:none}
