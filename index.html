<style>
:root{--bg:#0e1411;--bg2:#16201b;--tx:#ece8dc;--mu:#9aa89f;--ac:#d4a94a;--em:#3fb583;--bd:#2a3a32;--sb:#0a0f0c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1ea;--bg2:#fff;--tx:#1b2620;--mu:#5d6b63;--ac:#9a6f10;--em:#1f8a5b;--bd:#d8d6cb;--sb:#e8e5da}}
:root[data-theme="dark"]{--bg:#0e1411;--bg2:#16201b;--tx:#ece8dc;--mu:#9aa89f;--ac:#d4a94a;--em:#3fb583;--bd:#2a3a32;--sb:#0a0f0c}
:root[data-theme="light"]{--bg:#f3f1ea;--bg2:#fff;--tx:#1b2620;--mu:#5d6b63;--ac:#9a6f10;--em:#1f8a5b;--bd:#d8d6cb;--sb:#e8e5da}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4,button,input,select,textarea,nav{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.g{position:absolute;width:var(--s);height:var(--s);background:linear-gradient(135deg,var(--ac),var(--em));opacity:.1;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.gx{left:-15%;top:var(--y);animation:rx var(--d) linear infinite alternate}
.gy{top:-15%;left:var(--x);animation:ry var(--d) linear infinite alternate}
@keyframes rx{to{transform:translateX(115vw) rotate(180deg)}}
@keyframes ry{to{transform:translateY(115vh) rotate(-180deg)}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.g{animation:none}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--sb);border-bottom:1px solid var(--bd)}
header h1{font-size:18px;margin:0;flex:1;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac)}
.pr{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
#side{position:fixed;z-index:10;top:0;bottom:0;left:0;width:280px;max-width:85%;background:var(--sb);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .25s;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
#side.o{transform:none}
#side button{text-align:left;border:0;background:none;padding:12px;font-size:15px;color:var(--tx);border-radius:8px}
#side button.a{background:var(--bg2);color:var(--ac);font-weight:bold}
#sh{position:fixed;inset:0;z-index:9;background:#0008;display:none}#sh.o{display:block}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px 14px 80px}
h2{margin:6px 0 12px;font-size:22px;color:var(--ac)}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;color:var(--tx)}
.card img{width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.tag{display:inline-block;font:12px system-ui;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin:2px 4px 2px 0}
.tag.s{color:var(--em);border-color:var(--em)}.tag.x{color:#e07a5f;border-color:#e07a5f}
.mu{color:var(--mu);font-size:14px}
label{display:block;margin:10px 0 4px;font:600 13px system-ui;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
select option{background:var(--bg2);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.cm{border-top:1px solid var(--bd);margin-top:8px;padding-top:6px;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.ad-card{background:linear-gradient(135deg,rgba(212,169,74,0.08),rgba(63,181,131,0.08));border:1px dashed var(--ac);text-align:center;padding:12px;font-size:13px;color:var(--mu)}
#st{position:fixed;z-index:20;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#111;padding:8px 14px;border-radius:99px;font:600 14px system-ui;display:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.grid-2{grid-template-columns:1fr}}
.cert-box{border:2px dashed var(--ac);padding:15px;background:rgba(212,169,74,0.05);border-radius:10px;position:relative;text-align:center}
.watermark{position:absolute;top:40%;left:10%;right:10%;transform:rotate(-20deg);font-size:28px;color:rgba(212,169,74,0.15);font-weight:bold;pointer-events:none}
.color-badge{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid #fff3}
</style>
</head>

function generateQuiz(){
 const correctItem = ALL_MIN[Math.floor(Math.random() * ALL_MIN.length)];
 let options = [correctItem.name];
 while(options.length < 4){
  const randItem = ALL_MIN[Math.floor(Math.random() * ALL_MIN.length)];
  if(!options.includes(randItem.name)) options.push(randItem.name);
 }
 options.sort(() => Math.random() - 0.5);
 currentQuiz = { name: correctItem.name, desc: correctItem.note, streak: correctItem.streak, color: correctItem.colorCode, options };
}

let audioCtx = null;
let baseOffset = 0;
let currentRawUT = 45;

function playGeigerBeep(freq, duration) {
 try {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
 } catch(e){}
}

function calibrateMagneticSensor(){
 baseOffset = currentRawUT || 45.0;
 toast('Imekalibrishwa! Mazingira ya sasa yamefanywa sifuri.');
}

function startMagneticSensor(){
 const out = $('#mag_out');
 const analysis = $('#mag_analysis');
 const needle = $('#needle');
 const centerVal = $('#radar_center');
 
 if (!window.DeviceOrientationEvent) {
  if(out) out.textContent = "Kihisi cha magnetometer hakipatikani kwenye kifaa hiki.";
  return;
 }
 
 toast('Scanner imewashwa! Tembea polepole na simu.');
 
 magneticWatcher = (event) => {
  let alpha = event.alpha ? event.alpha : 0;
  let beta = event.beta ? Math.abs(event.beta) : 0;
  let gamma = event.gamma ? Math.abs(event.gamma) : 0;
  
  let raw = ((Math.abs(alpha) + beta + gamma) / 4) + 38.5;
  currentRawUT = raw;
  let uT = Math.max(0, raw - baseOffset);
  
  if(needle) needle.style.transform = `rotate(${alpha}deg)`;
  if(centerVal) centerVal.textContent = `${uT.toFixed(1)}µT`;

  let direction = alpha < 45 ? "Kaskazini (N)" : alpha < 135 ? "Mashariki (E)" : alpha < 225 ? "Kusini (S)" : alpha < 315 ? "Magharibi (W)" : "Kaskazini (N)";
  let depth = uT > 25 ? "Kitu kiko karibu sana na uso wa ardhi (0 - 20 CM)" : uT > 15 ? "Kina cha wastani (20 CM - 80 CM)" : uT > 8 ? "Kina cha chini (80 CM - 2.5 Metri)" : "Hakuna kiashiria kikubwa karibu";
  let depositType = uT > 30 ? "🔥 Mkusanyiko Mkubwa Sana (Rich Pocket / Mshipa Mnene)" : uT > 15 ? "💎 Madini ya Kiasi (Moderate Deposit)" : uT > 6 ? "🟡 Viashiria Vidogo vya Madini" : "⚪ Hakuna Mkusanyiko Maalum";
  let status = uT > 15 ? "🔴 KIMEONEKANA / KIPO HAPA!" : "🟢 ENEO LA KAWAIDA";

  if (uT > 10) {
   let freq = 200 + (uT * 25);
   playGeigerBeep(freq, 0.08);
  }

  if(out) out.innerHTML = `Usumaku: <b style="color:var(--em);font-size:20px">${uT.toFixed(2)} µT</b><br><span style="font-size:13px;color:var(--mu)">Uelekeo: ${direction} (${alpha.toFixed(0)}°)</span>`;
  if(analysis) analysis.innerHTML = `
   <p><b>Hali ya Eneo:</b> <span style="color:var(--ac);font-weight:bold">${status}</span></p>
   <p><b>Upande Husika (Azimuth):</b> 🧭 <b>${direction}</b> (${alpha.toFixed(0)}°)</p>
   <p><b>Aina ya Mkusanyiko:</b> 📊 <b>${depositType}</b></p>
   <p><b>Makisio ya Kina / Umbali:</b> 📏 <b>${depth}</b></p>
  `;
 };
 window.addEventListener('deviceorientation', magneticWatcher, true);
}

function stopMagneticSensor(){
 if(magneticWatcher){
  window.removeEventListener('deviceorientation', magneticWatcher);
  magneticWatcher = null;
  const o=$('#mag_out'); if(o) o.textContent = "Kihisi kimesimamishwa.";
 }
}

function calcSG(){
 const dry=parseFloat($('#sg_dry').value), water=parseFloat($('#sg_water').value);
 if(!dry||!water||dry<=water){toast('Weka namba sahihi!');return;}
 const sg=(dry/(dry-water)).toFixed(2);
 let match="Quartz / Feldspath";
 if(sg>=5.0&&sg<=8.5) match="Coltan, Cassitérite, au Galène";
 else if(sg>=15) match="Dhahabu Safi (Native Gold)";
 $('#sg_out').innerHTML=`SG: <b>${sg}</b><br>Madini Yanayofanana: <i>${match}</i>`;
}

function calcCarat(){
 const l=parseFloat($('#g_l').value)||0, w=parseFloat($('#g_w').value)||0, d=parseFloat($('#g_d').value)||0, sg=parseFloat($('#g_type').value)||2.65;
 if(!l||!w||!d){toast('Jaza vipimo vyote!');return;}
 const carat=(l*w*d*0.0026*sg).toFixed(2);
 $('#carat_out').innerHTML=`Uzito uliokadiriwa: <b>${carat} Carats</b>`;
}

let emfScannerWatcher = null;
function runAdvancedEmfScan(){
 const card = $('#card_emf'), tag = $('#status_tag_4'), display = $('#emf_display'), icon = $('#emf_icon'), text = $('#emf_text'), loader = $('#emf_loader'), btnStart = $('#btn_emf_start'), btnStop = $('#btn_emf_stop');
 if (!window.DeviceOrientationEvent) {toast("Kihisi cha EMF hakipatikani kwenye simu hii.");return}
 btnStart.style.display = 'none'; btnStop.style.display = 'block'; tag.className = 'tag x'; tag.textContent = 'Inapima...'; card.style.borderColor = 'var(--ac)';
 loader.style.display = 'block'; icon.style.display = 'none'; display.style.background = 'rgba(212,169,74,0.05)';
 toast('EMF Scanner imewashwa!');
 emfScannerWatcher = (e) => {
  let alpha = e.alpha ? Math.abs(e.alpha) : 0, beta = e.beta ? Math.abs(e.beta) : 0, gamma = e.gamma ? Math.abs(e.gamma) : 0;
  let emfVal = ((alpha + beta + gamma) / 3) + 25.0;
  if (emfVal > 45) {
   try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300 + (emfVal * 5), audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
   } catch(err){}
  }
  if (emfVal > 65) {
   tag.className = 'tag x'; tag.textContent = '⚡ Nyaya / Umeme'; card.style.borderColor = '#e07a5f'; display.style.background = 'rgba(224,122,95,0.1)'; icon.textContent = '🚨';
   text.innerHTML = `<b style="color:#e07a5f; font-size:18px;">Mionzi ya Juu ya EMF! (${emfVal.toFixed(1)} µT)</b><br><span class="mu" style="font-size:13px;">Uwezekano wa uwepo wa nyaya au umeme ukutani/chini ya ardhi.</span>`;
  } else {
   tag.className = 'tag s'; tag.textContent = '🟢 Salama'; card.style.borderColor = 'var(--em)'; display.style.background = 'rgba(63,181,131,0.08)'; icon.textContent = '⚡';
   text.innerHTML = `<b style="color:var(--em); font-size:16px;">Kiwango cha Kawaida cha EMF: ${emfVal.toFixed(1)} µT</b><br><span class="mu" style="font-size:13px;">Eneo liko salama; hakuna nyaya zenye nguvu kubwa karibu.</span>`;
  }
 };
 window.addEventListener('deviceorientation', emfScannerWatcher, true);
}

function stopAdvancedEmfScan(){
 if(emfScannerWatcher){window.removeEventListener('deviceorientation', emfScannerWatcher);emfScannerWatcher = null}
 $('#btn_emf_start').style.display = 'block'; $('#btn_emf_stop').style.display = 'none'; $('#emf_loader').style.display = 'none'; $('#emf_icon').style.display = 'block';
 $('#status_tag_4').className = 'tag s'; $('#status_tag_4').textContent = 'Imesimama'; $('#card_emf').style.borderColor = 'var(--bd)';
 $('#emf_text').innerHTML = 'EMF Scanner imesimamishwa.'; toast('EMF Scanner imesimamishwa.');
}
